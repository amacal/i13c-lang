  corrections:
    - "Assumed CALL's existing target: AsmletId | FunctionId field could stay separate from the new user-writable operand shapes; corrected to one widened CALL.operands: tuple[Register | Address | Relocation | AsmletId | FunctionId] union, the field renamed from target to operands for consistency with every other mnemonic dataclass"
  bugs_found:
    - "INSTRUCTIONS_TABLE[b'jmp'] already registered reg64()/addr64() variants before this session, but emit_jmp unconditionally asserted a Relocation-shaped operand and encode_jmp only implemented E9 cd (JMP rel32); jmp rax / jmp qword [rbx] passed resolution then crashed with a raw AssertionError. Fixed by adding the FF /4 (JMP r/m64) ModRM-based path, unified with CALL's FF /2 form in one encode_group_call(opcode, ext, ...)"
    - "Registering call in CALL_MNEMONICS with no corresponding blocklet-dispatch entry caused call rax to crash with a raw KeyError: b'call' at blocklet emission"
    - "Widening CALL.operands to include Register | Address | Relocation broke the pre-existing internal call mechanism: calls.py still constructs CALL(operands=(asmlet.id,)) / CALL(operands=(function.id,)) for every internal function call, but the new encode_group_call only branched on Relocation vs. (Address, Register), so every internal call (confirmed via data/hello.i13c's print()/exit() calls) crashed with an AssertionError. Fixed by adding a third branch for (FunctionId, AsmletId) targets"
  completed:
    - "Registered loope (E1 cb) and loopne (E0 cb), mirroring loop's (E2 cb) rel()-only shape; added LOOPE/LOOPNE dataclasses, emit_loope/emit_loopne via a shared generic emit_loop, and encode_loope/encode_loopne via a shared encode_group_loop"
    - "Fixed JMP's reg64()/addr64() crash and unified JMP/CALL's indirect-form encoding into one encode_group_call(opcode, ext, instruction, bytecode), parameterized by the Group 5 opcode-extension digit (0x04 for JMP, 0x02 for CALL)"
    - "Made CALL genuinely user-writable for register/memory/local-label targets (call rax / call [rbx] / call @label) while preserving the pre-existing internal cross-function call mechanism"
    - "Extended the exhaust()/cover()/expand() test harness to support rel()-shaped operands for the first time: expand('rel') now returns four symbolic markers (@prev5/@prev1/@next1/@next5), and the rel() test tables embed real, resolvable multi-instruction NOP-padded snippets so the relocation math is proven through the actual resolver rather than by constructing dataclasses directly"
    - "Added dedicated exhaust()/encode()-based test files for jmp, loop, loope, loopne, nop, ret, and syscall (nop/ret/syscall previously had no dedicated per-mnemonic test file at all)"
    - "Verified live: jmp rax -> 48 ff e0, jmp qword [rbx] -> 48 ff 23, loope @nibble -> e1 fa, loopne @nibble -> e0 f8"
