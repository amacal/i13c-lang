    - "frames.saved's exact semantics (driven by which registers appear in any call's own clobbers clause within the function, not by which registers the allocator's coloring actually uses) was newly understood as a side-finding this session, though it is pre-existing behavior from Function-Entry Prologue and Epilogue Lowering, not something changed today"
