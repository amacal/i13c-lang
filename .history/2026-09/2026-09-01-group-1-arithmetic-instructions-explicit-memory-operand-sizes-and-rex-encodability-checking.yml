  source: —
  status: completed
  attempted:
    - "Build exhaustive encoding test coverage for all SDM-supported mnemonics, starting from ADD/AND/OR/SUB, following the PUSH/POP test-completeness precedent"
  explored:
    - "Compared the two test harnesses (tests/encoding/__init__.py's encode_instruction vs tests/encoding/core.py's compile()/encode()/exhaust()) to explain why SUB's missing INSTRUCTIONS_TABLE registration was never caught by its existing test"
    - "Audited AND's existing INSTRUCTIONS_TABLE entry against the SDM's Group 1 opcode table, cross-checking width-mismatched entries against two Intel SDM PDF revisions"
    - "Compared deriving memory-operand width from a paired register versus requiring an explicit size annotation; chose the explicit-annotation design"
    - "Compared folding the ah/REX-conflict check into INSTRUCTIONS_TABLE's shape-based variant list versus a separate validation pass; chose the separate pass"
  tried:
    - "Narrowed encode_rex's REX.W decision to a two-branch Register/Address dispatch; found it dropped the Relocation/Fixed (RIP-relative) case, regressing existing MOV/SHL tests"
    - "A list-position-based heuristic for RegisterAcceptance.index (R8-R15 detection) before settling on register-number-based logic"
  corrections:
    - "Believed and.py's `and rax, [rax + 1 * rcx + 0x00]` displacement-elision expectation was a real encoder bug; corrected to a deliberate design choice (an explicit +0x00 is honored, not silently minimized) — the test table's expected bytes were wrong, not the encoder"
    - "Believed the accumulator-vs-sign-extended-imm8 opcode choice for `and rax, 0x00000001` should minimize bytes; corrected the same way — the encoder trusts the immediate's declared lexical width, test table corrected instead"
    - "An older Intel SDM PDF's AND page had a documentation defect (the `REX + 20 /r` row's free-text Description column contradicted its own Instruction column, claiming an r/m64+r8 form that doesn't exist); confirmed via the current SDM revision (v092) that the row is corrected there"
  bugs_found:
    - "sub, call, xchg had encoders (encoding/__init__.py's DISPATCH_TABLE) but no entry in resolutions/mnemonics.py's INSTRUCTIONS_TABLE — rejected by the compiler (E3024 unknown-mnemonic) despite being fully encodable. Resolved for sub; call/xchg left as-is."
    - "AND's INSTRUCTIONS_TABLE entry accepted mismatched-width MR/RM pairs — (reg64,reg8), (reg8,reg64), (addr64,reg8) — with no matching SDM encoding. Removed."
    - "encoding/kind.py's AddressInfo.get_width hardcoded 64 regardless of the actual memory operand — and [mem], imm16 / and [mem], reg32 crashed with KeyError inside encode_group. Fixed once address size resolution was added."
    - "blocklets.py's emit_and/emit_or used accept_reg (register-only) for the destination despite INSTRUCTIONS_TABLE already accepting an address destination — and [mem], imm8 crashed with AssertionError. Fixed via accept_reg_addr/accept_reg_imm_addr."
    - "kind.py's encode_rex inferred REX.W and the mandatory 0x66 prefix from isinstance(target, Register) — and word [rax], cx silently omitted 0x66 (would decode as a 32-bit operation), and and al, [rcx] got a spurious REX.W. Fixed by dispatching on resolved operand width instead of operand type."
    - "encode_rex's spl/bpl/sil/dil REX-presence check only examined its single target parameter, missing cases where the low-byte register was the reg/rm/opcode-reg operand instead. Fixed via a new rex_h field computed per-operand in encode_modrm_reg/encode_modrm_rm/encode_opcode_reg."
    - "math.py's Group 1 EXT-digit derivation from the base opcode used value << 3, then value // 3, before landing on the correct value // 8."
    - "resolutions/registers.py's RegisterAcceptance.index (R8-R15 detection) went through three broken states — unpopulated, then a bucket-list-position heuristic that misclassified different registers depending on bucket length — before the correct kind == \"8bit\" or kinds[kind].index(entry.name) >= 8."
    - "resolutions/instructions.py's is_index_high checked isinstance(operand.target.indx, RegisterAcceptance), which can never be true (indx is an IndexAcceptance wrapping .target), and nested the index check inside the base check so index-only addresses were skipped. Both fixed."
    - "tests/encoding/core.py's encode() asserted sections is not None before checking encoding is None, breaking correctly-rejected instructions. Fixed by checking rejection first."
    - "tests/encoding/core.py's expand() had no reg32/reg8 cases — would crash cover() with ZeroDivisionError if exercised. Added."
    - "llvm.py's Address.__str__ omitted the size annotation, breaking exhaust()'s completeness check once qword annotations were added to PUSH/POP's tables. Fixed."
  completed:
    - "Registered all 8 SDM Group 1 mnemonics (ADD/OR/ADC/SBB/AND/SUB/XOR/CMP) in INSTRUCTIONS_TABLE via one shared GROUP1_VARIANTS list, resolving the Instruction-Table Grouping by SDM Opcode Group future-target"
    - "Implemented a shared emit_group1 in blocklets.py and a shared encode_group(base_opcode, ...) in math.py, deriving every Group 1 opcode from one base-opcode-per-mnemonic byte"
    - "Implemented explicit byte/word/dword/qword memory-operand size syntax end to end: AST, entities, resolutions, and encoding"
    - "Implemented a general (not Group-1-specific) semantic check rejecting instructions that combine a legacy high-byte register (ah/ch/dh/bh) with any register that forces a REX prefix to exist"
    - "Wrote exhaustive encoding tests for all 8 Group 1 mnemonics (add.py, and.py, or.py, sub.py, adc.py, sbb.py, xor.py, cmp.py)"
    - "Verified src/tests/encoding/, src/tests/syntax/, src/tests/semantic/, and src/tests/core/ all pass (695 and 487 tests respectively)"
  not_completed:
    - "call and xchg remain unregistered in INSTRUCTIONS_TABLE (same shape of gap as sub, out of today's scope)"
    - "ADC/SBB/XOR/CMP were not each independently re-verified byte-for-byte against a rendered SDM page the way ADD/AND/OR/SUB were, beyond the opcode tables gathered during design"
  open_questions:
    - "Whether blocklets.py's emit_asmlets dispatch dict should become a graph-derived artifact of INSTRUCTIONS_TABLE rather than a separately hand-maintained parallel dict, to prevent the same class of registration drift (e.g. xchg present in one table, absent from the other) from recurring — deliberately deferred"
    - "Whether AddressAcceptance.size's default of 64 when no explicit annotation is given should instead be a hard rejection, forcing every memory operand with a data access to carry an explicit size"
