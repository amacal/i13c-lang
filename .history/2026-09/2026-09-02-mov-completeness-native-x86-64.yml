  source: —
  status: completed
  attempted:
    - "Audited and completed native x86-64 MOV instruction support: opcode selection in the encoder, mnemonic-table coverage, and the compiler's own internal MOV-construction paths."
  explored:
    - "Whether MOV belongs to an SDM opcode group, compared directly against Group 1's shared-opcode-extension mechanism."
    - "Whether mnemonics.py's accepted MOV operand-width combinations should mirror real SDM opcode rows exactly (Group 1's own convention) versus accepting any narrower-immediate-into-wider-register combination."
    - "Whether MOVZX could serve as a fix for a narrow compile-time immediate being loaded into a wider register."
  tried:
    - "Widening the destination register to match a narrow immediate's own width via a register-alias helper with no width floor — regressed an existing test expecting a full 64-bit register (mov rdi, 0x05 becoming mov dil, 0x05)."
    - "Mapping MOV's (dst-width 64, imm-width 32) register case directly onto the B8+rd short-form opcode instead of the correct C7/0 register-direct ModRM form."
  corrections:
    - "Assumed MOV does not belong to any SDM opcode group; corrected to: MOV's C6/C7 /0 immediate-to-r/m forms are SDM's Group 11, a single-occupant opcode-extension slot using the same ModRM-reg-as-extension mechanism as Group 1."
    - "Assumed MOVZX could zero-extend a compile-time immediate into a wider register; corrected via the SDM's own Instruction Operand Encoding table (Vol 2B, MOVZX) showing only an RM form exists, no immediate source at all."
    - "Assumed the resolver's mnemonics.py table should accept any (regN, immM) pair with M<=N; corrected to matching only pairs backed by a real, distinct SDM opcode, per the same convention Group 1's own table already follows."
  bugs_found:
    - "encode_mov's 'mov reg, r/m' branch always emitted opcode 0x8B regardless of destination width, never 0x8A for 8-bit destinations (SDM: 8A /r vs 8B /r) — fixed by extracting a shared encode_mr helper in math.py reusing Group 1's existing SPEC[\"MR\"]/SPEC[\"RM\"] width-keyed opcode tables."
    - "encode_mov's 'mov r/m, imm' branch always emitted opcode 0xC7 with a 32-bit immediate regardless of destination width — fixed via new width-keyed MOV_MEM_IMM/MOV_REG_IMM opcode dicts."
    - "encode_mov's short-form register-embedded opcode (B0+rb/B8+rd) never computed or wired opcode_reg via kind.encode_opcode_reg, so the register index was never folded into the opcode byte; register index 0 happened to look correct by coincidence, exposed only once a non-zero register (e.g. ecx) was tested."
    - "encode_mov's branch routing was keyed on 'immediate is not None', which incorrectly skipped ModRM-byte writing for the reg64,imm32 case (REX.W+C7/0 register-direct) and for every MOV_MEM_IMM case — both carry an immediate but also need a ModRM byte; fixed by keying the routing on 'opcode_reg is not None' instead."
    - "calls.py and assigns.py construct MOV instructions directly for calling-convention/spill codegen, bypassing mnemonics.py's resolution table entirely; both built MOV(reg64, imm8-or-imm16) unwidened, which crashed with KeyError in move.py's opcode dicts. Fixed via Hex.extend(width) (core.py) and RegisterInfo.derive32/ImmediateInfo.extend32 (llvm.py), both coercing width to max(original-width, 32) per SDM Vol 1 §3.4.1.1's zero-extension rule."
    - "build_instruction_resolution recorded a near-miss rejection unconditionally after the per-instruction variant loop, so resolutions/instructions/rejected showed a rejected variant even for instructions separately accepted via a different variant; moved the rejection-recording block inside 'if not resolution.accepted' so it only fires for instructions with zero accepted variants."
    - "data/hello.i13c (uncommitted changes introduced during this session's own hand-testing, confirmed via git blame not to be prior debt): 'and r11b, 0x0f' only masked the low byte of r11 while the full r11 was used as an index register two instructions later in [rsp + r11 - 0x10]; several syscall-argument setup lines had been narrowed to 8-bit forms (mov dil/al/dl) leaving upper bits unmodified for a syscall that reads the full 64-bit register."
  completed:
    - "Extended mnemonics.py's MOV_VARIANTS to cover every real SDM-listed MOV encoding (reg8/16/32/64 x reg/imm/addr forms), matching exactly one variant per distinct opcode row; deliberately excludes segment-register (8C/8E) and moffs (A0-A3) forms."
    - "Fixed all four encode_mov bugs and the calls.py/assigns.py width-normalization gap listed above."
    - "Fixed data/hello.i13c's partial-register-write bugs and exit()'s parameter type/range syntax (code@imm: u8 -> code@imm: u32[0x00000000..0x000000ff])."
    - "Removed the dead, never-instantiated Fixed variant from MOV's operand type in llvm.py."
    - "Rendered SDM pages at 600 DPI for all 20 currently-supported mnemonics plus MOVZX and the general-purpose-register operand-size page (Vol 1, section 3.4.1.1), and raised CLAUDE.md's default spec-rendering DPI from 200/300 to 600/900."
    - "Verified end to end: full src/tests/encoding/ (604 tests) and src/tests/semantic/ (423 tests) suites pass; poetry run i13c elf ./data/hello.i13c compiles cleanly and the resulting binary runs, printing the expected literal and exiting 0; spot-checked disassembly for the fixed opcodes."
  not_completed:
    - "Whether Group 1's own mnemonics table (GROUP1_VARIANTS) has the same narrow-immediate-rejected-for-wider-register gap in any of its width combinations was raised but not investigated."
  open_questions:
    - "Same as above — left open pending its own audit of GROUP1_VARIANTS against Group 1's real opcode table."
  notes:
    - "Segment-register and moffs MOV forms are treated as out of scope for this compiler: moffs needs a bare 64-bit absolute address representation the current Address type can't express; segment registers have no entity in this compiler at all."
    - "OpCodeEncoding.default() was added to kind.py during this session but ended up unused by the final fix — the branch-routing fix keys on 'opcode_reg is not None' directly, not this helper."
