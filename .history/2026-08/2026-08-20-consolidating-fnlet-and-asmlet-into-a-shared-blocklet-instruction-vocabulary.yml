    - "Edited CLAUDE.md's own 'Spec study sessions' and 'Session closing ritual' text, by explicit user instruction: .tmp/'s rendered spec-page images now persist indefinitely across sessions as a reusable cache (organized as .tmp/<doc-slug>/<page>-<slug>.png) instead of being deleted at each session's closing ritual"
    - "data/hello.i13c's print_asm asmlet is not marked noreturn and has no explicit ret at the end of its body (ends in a returning syscall); since asmlet calls compile to a real CALL instruction, this would fall through past the asmlet's own compiled code. Noted, not fixed (data/ is out of scope)"
    - "Blocklet's .listing() method (a plain list[str] of each instruction's __str__) was applied broadly across this session's new/rewritten tests, directly answering the per-instruction content-testing gap named by the still-open 'Testing Generated Instruction Sequences' future target, though that target was not marked resolved"
