  source: —
  status: completed
  attempted:
    - "Materialize `fn`-declared function bodies (single-block scope; asmlet wiring and multi-block linearization explicitly deferred) into one ordered pseudo-instruction stream, consuming existing register-allocation, argument-placement, spill, and stack-frame analyses instead of the disclaimed `llvm/` module"
  explored:
    - "Investigated the CLI's `i13c elf` failure path for compiling data/hello.i13c; confirmed the disclaimed llvm/ module's dead verify() gate from Restore a Green Build, and found the AND, SHR, and LOOP mnemonics used by hello.i13c's print_asm asmlet have no encoding or IR support; neither was addressed, this session's pipeline was built entirely in semantic/ instead"
    - "Traced why fn-to-fn call arguments' allocated homes are always disjoint from their calling-convention destinations (clobber-precoloring forces any value live at a call node away from that call's clobbers, which default to the full caller-saved set for a fn-to-fn call), and used that to justify deferring literal- and spill-load-sourced shuffle entries to the end of the emission order"
  tried:
    - "Modeled correlating a CFG node's StatementId to its lowered instructions via an index bridging through CallSiteId; superseded by unifying calls, assigns, and mid-body spill-stores into one StatementId-keyed analyses/statements table instead"
  corrections:
    - "Assumed the stack-pointer-adjustment instruction needed a general destination-register field; corrected to a dedicated DecreaseStackPointer/IncreaseStackPointer pair operating implicitly on rsp"
    - "Assumed analyses/shuffles had no handling for literal call arguments; corrected once ShuffleImmediate was found already implemented, consuming LiteralAcceptance directly"
    - "Assumed a StatementId-keyed index bridging through CallSiteId was needed to connect calls/assigns to a CFG node's statement; corrected to iterating all statements once in analyses/statements and dispatching on the resolved type"
  bugs_found:
    - "entities/calls.py's build_calls called graph.function.values.get_ctx(nid) using a call's own node id against the values Bidirectional registry, not calls; NodesVisitor already wires a call's context to its owning Statement directly. Fixed to graph.function.calls.get_ctx(nid); this alone had been causing ~123 failing tests across unrelated files"
    - "indices/functions.py's build_functions_by_callsites called the unsafe OneToOne.get() on every callsite's signature id, including callsites targeting asmlets, which are never present in the fn-only signatures index; crashed on any program with an asmlet call. Fixed to the safe OneToOne.find()"
    - "analyses/shuffles.py's build_mapping silently dropped any call argument whose value was spilled rather than colored, via a bare except KeyError: pass. Fixed by adding a ShuffleLoad variant and handling the spilled case explicitly"
    - "analyses/calls.py's emit() initially grouped shuffle moves by instruction type (all immediates first, then moves, then exchanges) rather than preserving build_moves' dependency-respecting order, which could clobber a register another move still needed to read. Fixed to moves, then exchanges, then loads, then immediates"
    - "analyses/fnlet.py's spill-consuming loop had SpillReg's and SpillScratch's Move operand tuples swapped, producing a load where a store was intended and vice versa, despite both ops having an identical field shape. Fixed"
    - "A duplicate spill-store emission was introduced when spill-consumption moved from analyses/fnlet.py into analyses/statements.py, because fnlet.py's own leftover spill loop wasn't removed in the same change. Removed before being left in"
  completed:
    - "Implemented analyses/assigns, lowering an assign statement's right-hand side into its destination's register or scratch"
    - "Implemented analyses/calls, lowering a call statement's argument placement plus a Call to either an asmlet or function target"
    - "Implemented analyses/statements, unifying calls, assigns, and mid-body spill-stores into one StatementId-keyed table"
    - "Implemented analyses/fnlet, assembling one function's prologue, per-node statement dispatch, and epilogue into an ordered instruction stream ending in Return"
    - "Added ShuffleLoad to analyses/shuffles for spilled call arguments, closing a previously-silent gap"
    - "Added indices/functions, indices/shuffles, and indices/spills, bridging callsites and CFG nodes to their Function, Asmlet, ShuffleCallSite, and SpillOp entries"
    - "Added a shared pseudo-instruction vocabulary in typing/analyses/llvm.py (Register, Slot, Immediate, Move, Exchange, stack-pointer ops, Call, Return), replacing per-analysis bespoke instruction types"
    - "Added test coverage for analyses/calls (moves, exchanges, loads, immediates, and cycles, verified by isinstance and register name) and analyses/assigns; added instruction-count coverage for analyses/fnlets"
    - "Verified make lint and make test-semantic both pass (407 tests) with all changes in place"
  not_completed:
    - "analyses/fnlets has no per-instruction content tests, only instruction counts"
    - "The disclaimed llvm/ module's verify() gate bug from Restore a Green Build remains unfixed; this session's pipeline is not connected to the CLI's i13c elf path"
    - "The AND, SHR, and LOOP mnemonics needed by data/hello.i13c's print_asm asmlet have no encoding or IR support"
    - "Asmlet-to-funclet wiring and multi-block/linearization remain out of scope, per this session's own stated scoping decision"
    - "An asmlet whose declared clobbers list omits one of its own binding registers lets the allocator color another live value into that register, which the shuffle then silently overwrites; identified, not fixed"
  open_questions:
    - "Whether an asmlet's effective clobber set should automatically union in its own binding registers, or whether the compiler should instead reject an asmlet whose declared clobbers list omits one of its own bindings, was raised and left undecided"
