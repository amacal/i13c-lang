  attempted:
    - "Extend Register Allocation (semantic layer) to account for calling convention — model call clobbers as interference, model argument-register bindings and safe/unbound registers, and correct the register palette to the full usable x86-64 GPR set"
  explored:
    - "Interference-graph construction options for representing call clobbers as precolored graph nodes, including why defs-only leaves a synthetic value invisible to liveness and why uses-only/defs-plus-uses both leak it backward to the function entry"
    - "Ordering requirements in build_allocations's precolor mechanism relative to copy = {k: set(v) for k, v in graph.items()} and to the simplify/select loop"
    - "Raising the register palette from k=8 to k=15, checked against encoding/'s existing rsp-relative stack-frame design (llvm/nodes/stacks.py) to confirm rbp is genuinely free to color"
    - "Cost tradeoff between spilling and callee-saved register preservation"
    - "Asymmetry between asmlet and plain-function calling convention, and that Asmlet's clobbers/bindings data was already fully resolved upstream but dropped before this session"
  tried:
    - "Considered dropping Calling from FlowValue in favor of a separate CallingRegister pseudo-value type, and considered reusing the existing but unused CallingBinding{idx,register} scaffold, before keeping Calling and adding CallingClobber/CallingBinding/CallingUnbound alongside it"
    - "Considered generating clobber pseudo-values directly in dflows.py's defs/uses, before moving that responsibility into a dedicated DataFlows/Liveness node-to-value-index field applied after build_liveness's fixed-point loop converges"
  corrections:
    - "Assumed adding a clobber pseudo-value to both defs[K] and uses[K] confines its liveness to node K; corrected by a failing test — defs[K] only cancels the live_out[K]-side contribution to live_in[K], never the uses[K]-side, so it still leaks backward to the function entry"
    - "Assumed slicing a single 9-entry caller-saved list by parameter count correctly split call arguments from clobbers for any function; corrected — a 7-or-more-parameter function would have bound rax or r10/r11 as argument registers, fixed by rejecting callsites with more than 6 arguments"
    - "Assumed general register-name resolution already restricted an asm snippet's clobbers clause to the 15-register palette used by build_allocations; corrected on inspection — it accepts rsp, rip, and narrower-width aliases too, none of which are in that palette"
  bugs_found:
    - "build_liveness's fixed-point recurrence let a clobber pseudo-value added to both defs[K] and uses[K] propagate backward through every predecessor to the function entry, confirmed by a failing live_in[entry] assertion; fixed by carrying clobbers on a separate DataFlows/Liveness field injected only after the fixed-point loop converges"
    - "build_callings's caller-saved-register slicing loop would bind rax or r10/r11 as argument registers for a function with more than 6 parameters; fixed by rejecting such callsites with a new too-many-arguments reason before build_callings ever sees them"
    - "asm ... clobbers <register-not-in-system_v> (e.g. rsp, rip, or a non-64-bit alias) is accepted by register resolution but raises an uncaught KeyError in build_allocations; not fixed this session"
  completed:
