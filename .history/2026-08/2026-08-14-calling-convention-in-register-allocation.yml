    - "Extended build_allocations with a 15-entry register-name-to-color table, precoloring of clobber values before simplify/select runs, removal of precolored nodes from the working graph after copy is taken, a palette raised to the table's full size, and stripping of clobber entries from the final colors output"
    - "Added tests across dflows/liveness/allocations/callings/asmlets/callsites covering clobber propagation, precoloring, a value surviving a partial asmlet clobber, two simultaneously-surviving values, and a value forced from caller-saved into callee-saved color range by a zero-parameter function call"
