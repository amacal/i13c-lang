  bugs_found:
    - "Pre-existing bug from the prior Calling Convention in Register Allocation session: build_allocations stripped CallingClobber precolored nodes and their edges out of the working graph before the simplify loop, but select still computed used colors from copy, the full original graph captured before that stripping; this let simplify measure a lower degree than the true interference reality, causing min(available) to raise ValueError: min() iterable argument is empty whenever two real values both survived across a call whose clobbers consumed nearly the whole register palette. Surfaced by a new two-call, 14-clobbers-per-call fixture (can_detect_allocations_with_forced_spill_two_blocks). Fixed by keeping clobber-precolored nodes resident in graph throughout simplify (never stripped, never pushed onto the worklist since already colored) and changing the simplify loop's stopping condition from 'graph is empty' to 'no non-precolored nodes remain', tracked via a count of distinct clobber pseudo-values"
  completed:
    - "Extended Allocation with a spills: dict[int,int] field populated by a second simplify/select pass over the subgraph of previously-uncolored values, with k sized to len(live.values) and no degree-check needed"
    - "Fixed the precolored-node/degree-desync bug described above"
    - "Added a new two-call heavy-clobber regression test (can_detect_allocations_with_forced_spill_two_blocks) and updated the existing forced-spill test's assertions to check the new spills field instead of only asserting absence from colors"
