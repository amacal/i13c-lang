    - "Extend Allocation (semantic layer) with a second graph-coloring pass that assigns symbolic stack slots to values that failed to receive a register color in the existing simplify/select pass, reusing the same interference graph and algorithm shape rather than building a separate analysis"
  explored:
    - "Whether slot-coloring should be a new analysis/GraphNode or extend Allocation directly; decided to extend Allocation with a new spills: dict[int,int] field, reusing the exact simplify/select algorithm on the subgraph induced by only the previously-uncolored value-indices"
