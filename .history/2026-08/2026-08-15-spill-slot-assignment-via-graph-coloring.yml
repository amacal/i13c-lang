    - "Why graph-coloring, not trivial index enumeration, is used for slot assignment: two non-interfering spilled values can share the same slot, mirroring the register-sharing benefit of the original coloring pass; confirmed against small worked cases (singleton spill gets slot 0; two interfering spills get distinct slots; two non-interfering spills share slot 0)"
  tried:
    - "An initial draft used spills: set[int] as a placeholder membership marker during the first (register) pass's forced-spill branch, then repurposed and cleared the same dict for the second pass's real slot assignments"
  corrections:
